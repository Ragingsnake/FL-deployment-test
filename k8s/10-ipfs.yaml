# Single IPFS node (per user requirement: only 1 IPFS node, not 2)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ipfs-data
  namespace: ipfs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ipfs
  namespace: ipfs
spec:
  serviceName: ipfs-svc
  replicas: 1
  selector:
    matchLabels: { app: ipfs }
  template:
    metadata:
      labels: { app: ipfs }
    spec:
      containers:
        - name: ipfs
          image: ipfs/kubo:v0.28.0
          ports:
            - { name: api,     containerPort: 5001 }
            - { name: gateway, containerPort: 8080 }
            - { name: swarm,   containerPort: 4001 }
          env:
            - { name: IPFS_PROFILE, value: "server" }
          volumeMounts:
            - { name: data, mountPath: /data/ipfs }
          readinessProbe:
            tcpSocket: { port: 5001 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ipfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs-svc
  namespace: ipfs
spec:
  selector: { app: ipfs }
  ports:
    - { name: api,     port: 5001, targetPort: 5001 }
    - { name: gateway, port: 8080, targetPort: 8080 }
