# 5 FL Client pods (Client 1..5) as a StatefulSet to get stable ordinals -> CLIENT_ID
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fl-client
  namespace: fl-clients
spec:
  serviceName: fl-client
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: fl-client }
  template:
    metadata:
      labels: { app: fl-client }
    spec:
      containers:
        - name: client
          image: ${REGISTRY}/fl-client:${TAG}
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # CLIENT_ID derives from StatefulSet ordinal (pod name ends with -0..-4)
            - name: CLIENT_ID_RAW
              value: "$(POD_NAME)"
            - { name: SPLIT_TYPE, value: "${SPLIT_TYPE}" }
            - { name: VERIFICATION_MODE, value: "${VERIFICATION_MODE}" }
            - { name: STAKING_ENABLED, value: "${STAKING_ENABLED}" }
            - { name: SECURE_AGG_ENABLED, value: "${SECURE_AGG_ENABLED}" }
            - { name: TRAINING_VERIFICATION_ENABLED, value: "${TRAINING_VERIFICATION_ENABLED}" }
            - { name: DEMO_ATTACK_TYPE, value: "${DEMO_ATTACK_TYPE}" }
            - { name: DEMO_ATTACK_CLIENTS, value: "${DEMO_ATTACK_CLIENTS}" }
            - { name: DEMO_ATTACK_START_ROUND, value: "${DEMO_ATTACK_START_ROUND}" }
            - { name: DEMO_ATTACK_END_ROUND, value: "${DEMO_ATTACK_END_ROUND}" }
            - { name: DEMO_ATTACK_SCALE, value: "${DEMO_ATTACK_SCALE}" }
            - { name: FL_SERVER_HOST, value: "fl-server-svc.aggregation.svc.cluster.local" }
            - { name: FL_SERVER_PORT, value: "8080" }
            - { name: IPFS_API, value: "/dns/ipfs-svc.ipfs.svc.cluster.local/tcp/5001" }
            - { name: ETH_RPC, value: "http://geth-svc.blockchain.svc.cluster.local:8545" }
            - { name: ZKP_NODE_URL, value: "http://zkp-node-svc.blockchain.svc.cluster.local:8090" }
            - name: REPUTATION_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: contract-address
                  key: REPUTATION_ADDRESS
                  optional: true
            - name: STAKING_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: contract-address
                  key: STAKING_ADDRESS
                  optional: true
          command: ["sh","-c"]
          args:
            - |
              # Extract ordinal from pod name (e.g. fl-client-2 -> 2), then start
              POD_NAME="${POD_NAME:-${HOSTNAME}}"
              CLIENT_ID="${POD_NAME##*-}"
              if ! echo "$CLIENT_ID" | grep -Eq '^[0-9]+$'; then
                echo "Invalid CLIENT_ID derived from POD_NAME='$POD_NAME'"
                exit 1
              fi
              echo "Starting client $CLIENT_ID ($SPLIT_TYPE)"
              python fl_client.py "$CLIENT_ID" "$SPLIT_TYPE"
